services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
  frontend:
    build: ./frontend
    environment:
      API_UPSTREAM: http://backend:8000
    ports: ["8080:80"]
    depends_on:
      backend:
        condition: service_healthy
